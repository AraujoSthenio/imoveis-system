spring:
  application:
    name: imoveis-api

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/imoveis}
    username: ${DATABASE_USERNAME:imoveis}
    password: ${DATABASE_PASSWORD:imoveis}
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway cuida do schema
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: INFO
    com.imoveis: DEBUG
