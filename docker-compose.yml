services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: imoveis
      POSTGRES_USER: imoveis
      POSTGRES_PASSWORD: imoveis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imoveis -d imoveis"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/imoveis
      DATABASE_USERNAME: imoveis
      DATABASE_PASSWORD: imoveis
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
